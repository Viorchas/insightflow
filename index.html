function overview(p, pending, params) {
  const original=p;
  p={...p,feedback:p.feedback.filter(f=>matchesFeedback(f,{from:params.get('from'),to:params.get('to')}))};
  pending=p.feedback.filter(f=>f.review==='pending').length;
  const reviewedOnly = params.get('scope') === 'reviewed';
  const valid = p.feedback.filter(f => effective(f) && (!reviewedOnly || isReviewed(f)));
  const reviewed = p.feedback.filter(isReviewed).length;
  const ranked = p.topics.map(t => ({ ...t, count: valid.filter(f => f.topicId === t.id).length })).filter(t => t.count).sort((a,b) => b.count-a.count);
  const negative = valid.filter(f => f.sentiment === 'negative').length;
  const portions = ['negative','neutral','positive','uncertain'].map(key=>valid.length ? valid.filter(f=>f.sentiment===key).length/valid.length*100 : 0);
  const edge1=portions[0], edge2=edge1+portions[1], edge3=edge2+portions[2];
  const stats = [[p.feedback.length, '用户反馈', '包括示例、待处理及已拒绝记录', 'chat'], [ranked.length, '反馈主题', `${p.topics.filter(t => t.status === 'candidate').length} 个候选主题待确认`, 'layers'], [pending, '待审核反馈', 'AI 建议需要你的判断', 'spark'], [p.requirements.length, '已创建需求', '每个需求均保留来源', 'list']];
  const max = Math.max(1, ...ranked.map(t => t.count));
  const dateValues = [...new Set(p.feedback.map(f => f.date).filter(Boolean))].sort().slice(-9);
  const values = dateValues.map(d => valid.filter(f => f.date === d).length), vmax = Math.max(1, ...values);
  return `<div class="demo-banner"><span class="banner-symbol">${icon('spark')}</span><div><strong>先探索，再做判断。</strong> 当前展示${p.isSample ? '演示项目的数据；合成原文与分析来源分别标识' : '当前浏览器内的数据；分类可能来自预设、模拟或真实模型'}，不代表真实用户或业务成绩。</div>${btn('about', '查看说明 '+icon('arrow'), 'text')}</div>${dateFilters(params)}${params.get('from')||params.get('to')?`<p class="footnote">已按日期排除 ${original.feedback.filter(f=>!f.date).length} 条时间未知反馈。${btn('clear-filters','清除筛选','text')}</p>`:''}
    <p class="scope-caption">统计范围：${params.get('from')||'不限起始'} 至 ${params.get('to')||'不限结束'}；以下分类图表${reviewedOnly?'只计人工已确认/修正的有效分类':'计入全部有效分类（包括未审核建议）'}。未分析与已拒绝分类不进入图表分母。</p><div class="stats">${stats.map(([value,title,note,ico]) => `<section class="stat"><div class="stat-label">${title}${icon(ico)}</div><strong>${value}<span>${title === '用户反馈' || title === '待审核反馈' ? '条' : '个'}</span></strong><small>${note}</small></section>`).join('')}</div>
    <div class="section-toolbar"><div class="section-title">反馈洞察 <span>INSIGHTS</span></div><div class="segmented"><button class="${!reviewedOnly ? 'selected' : ''}" data-action="scope-all">全部有效结果</button><button class="${reviewedOnly ? 'selected' : ''}" data-action="scope-reviewed">仅已审核</button></div></div>
    <div class="analytics-grid"><section class="panel topic-panel"><div class="panel-head"><div><h2>用户最关心什么</h2><p>按主主题汇总 · ${valid.length} 条有效分类 · 前 5 项</p></div><button class="link" data-action="nav-topics">全部主题 ${icon('arrow')}</button></div>${chartNote(valid)}${ranked.length ? `<div class="topic-bars">${ranked.slice(0,5).map((t,i) => `<button class="topic-bar-row" data-action="topic-feedback" data-id="${t.id}"><span class="rank">0${i+1}</span><div class="bar-body"><div class="bar-title"><span>${esc(t.name)} ${t.status === 'candidate' ? '<em>候选</em>' : ''}</span><strong>${t.count} <small>条</small><b>${Math.round(t.count/valid.length*100)}%</b></strong></div><div class="bar-track"><i style="width:${t.count/max*100}%;--bar:${['#b3d8bf','#b9c8f5','#e9c7a4','#cbd1d8'][i%4]}"></i></div></div></button>`).join('')}</div>` : empty('还没有可统计的主题', '导入反馈或切换统计口径后查看。')}</section>
    <section class="panel sentiment-panel"><div class="panel-head"><div><h2>用户情绪</h2><p>分类建议，不等同于满意度</p></div>${icon('chat')}</div>${chartNote(valid)}<div class="sentiment-body"><div class="donut" style="background:conic-gradient(#e6b6a0 0 ${edge1}%,#e5e9e8 ${edge1}% ${edge2}%,#aacaaf ${edge2}% ${edge3}%,#c2c8d8 ${edge3}% 100%)"><div><strong>${valid.length ? Math.round(negative/valid.length*100)+'%' : '—'}</strong><span>负向反馈占比</span></div></div><div class="legend">${[['negative','负向','#e6b6a0'],['neutral','中性','#e5e9e8'],['positive','正向','#aacaaf'],['uncertain','不确定','#c2c8d8']].map(([key,label,color]) => `<span><i style="background:${color}"></i>${label}<b>${valid.filter(f => f.sentiment === key).length}</b></span>`).join('')}</div></div></section></div>
    <div class="bottom-grid"><section class="panel"><div class="panel-head"><div><h2>反馈时间分布</h2><p>按反馈发生日期 · 柱高仅计当前有效分类</p></div><span class="subtle">${p.feedback.filter(f => !f.date).length} 条时间未知</span></div>${dateValues.length ? `<div class="histogram">${dateValues.map((d,i) => `<div class="hist-col"><span>${values[i]}</span><div class="hist-track"><i style="height:${values[i]/vmax*100}%"></i></div><small>${esc(d.slice(5))}</small></div>`).join('')}</div>` : empty('暂无日期数据', '未知日期的反馈仍计入总量。')}</section>
    <section class="panel next-step"><div class="panel-head"><div><h2>下一步，听清用户。</h2><p>从反馈到需求的工作流</p></div>${icon('arrow')}</div><div class="steps"><div><b class="step-done">${icon('check')}</b><span>导入用户反馈<small>${p.feedback.length} 条反馈已在工作区</small></span></div><div><b>02</b><span>审核主题与分类<small>已审核 ${reviewed}/${p.feedback.length} · 覆盖率 ${p.feedback.length ? Math.round(reviewed/p.feedback.length*100)+'%' : '—'}</small></span></div><div><b>03</b><span>形成可追溯的需求<small>用原文证据支撑每个判断</small></span></div></div>${btn('review-pending', '开始审核 '+icon('arrow'), 'secondary wide')}</section></div>`;
}

function feedbackPage(p, params) {
  const fieldFilters=[['source','来源'],['platform','平台'],['appVersion','App 版本']].map(([key,label])=>{const values=[...new Set(p.feedback.map(f=>f[key]).filter(Boolean))].sort();const chosen=params.get(key);if(chosen&&!values.includes(chosen))values.unshift(chosen);return `<label>${label}<select data-filter="${key}" aria-label="${label}筛选"><option value="">全部${label}</option>${values.map(value=>`<option value="${esc(value)}" ${chosen===value?'selected':''}>${esc(value)}</option>`).join('')}</select></label>`;}).join('');
  const all = filtered(params), pages = Math.max(1, Math.ceil(all.length/20)); page = Math.min(page, pages);
  const visible = all.slice((page-1)*20, page*20);
  return `${p.feedback.some(f=>f.analysisStatus==='queued')?`<div class="notice-inline">还有反馈未分类；导入结果已保存，分类不会自动完成。${btn('simulate','运行关键词模拟（不调用 AI）','text')}</div>`:''}<div class="filterbar"><label class="search">${icon('search')}<input id="search" type="search" placeholder="搜索反馈原文，按 Enter 筛选" value="${esc(params.get('q') || '')}"></label><select data-filter="topic" aria-label="主题筛选"><option value="">全部主题</option>${p.topics.map(t=>`<option value="${t.id}" ${params.get('topic')===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><select data-filter="review" aria-label="审核状态"><option value="">全部审核状态</option>${['pending','confirmed','modified','rejected'].map(s=>`<option value="${s}" ${params.get('review')===s?'selected':''}>${labels[s]}</option>`).join('')}</select>${btn('clear-filters','清除筛选','text')}</div>
    <div class="filterbar">${fieldFilters}${btn('manual-feedback','手工录入反馈','secondary')}${btn('export-feedback','导出当前筛选 CSV','text')}</div>${dateFilters(params)}<div class="filterbar"><label>处理状态 <select data-filter="analysis" aria-label="分析状态"><option value="">全部分析状态</option>${[['queued','待处理'],['succeeded','分析成功'],['failed','分析失败']].map(([v,l])=>`<option value="${v}" ${params.get('analysis')===v?'selected':''}>${l}</option>`).join('')}</select></label>${btn('import-history','查看导入历史','text')}${btn('analysis-history','真实分析记录','text')}</div><section id="ai-operation-status" class="ai-operation" aria-label="真实 AI 操作说明">${aiOperationStatus(p,backend,[...selected],esc,btn)}</section><div class="selection-bar"><span>共 ${all.length} 条反馈 · 已选 <b id="selected-count">${selected.size}</b> 条</span><div>${btn('select-visible','选择本页','text')}${btn('batch-confirm','批量确认','secondary')}${btn('selected-requirement','转为需求','secondary')}${btn('real-ai','真实 AI 分析','primary')}</div></div>
    <section class="panel table-panel">${visible.length ? `<div class="table-scroll"><table><thead><tr><th class="check-cell"></th><th>用户反馈</th><th>主主题 / 情绪</th><th>审核状态</th><th></th></tr></thead><tbody>${visible.map(f=>`<tr><td><input type="checkbox" aria-label="选择反馈：${esc(f.content.slice(0,16))}" data-select="${f.id}" ${selected.has(f.id)?'checked':''}></td><td class="feedback-content"><button data-action="detail" data-id="${f.id}">${esc(f.content)}</button><small>${esc(f.source)} <span>·</span> ${esc(f.platform || '平台未知')} <span>·</span> ${esc(f.date || '时间未知')} <span>·</span> ${esc(f.origin)}</small>${f.lastAiError ? `<small class="form-error">最近分析失败：${esc(f.lastAiError)}</small>` : ''}</td><td>${effective(f) ? `<span>${esc(topicOf(p,f)?.name || '未归类')}</span><div>${tag(labels[f.sentiment],f.sentiment)}</div>` : '<span class="subtle">无有效分类</span>'}</td><td>${reviewTag(f)}</td><td><button class="icon-btn" aria-label="查看反馈详情" data-action="detail" data-id="${f.id}">${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>` : empty('没有匹配的反馈', '尝试清除筛选，或导入一份新的 CSV。', btn('clear-filters','清除筛选'))}<div class="pagination"><span>第 ${page} / ${pages} 页</span><div>${btn('prev-page','上一页','secondary',page===1?'disabled':'')}${btn('next-page','下一页','secondary',page===pages?'disabled':'')}</div></div></section><p class="footnote">模拟分类和示例预设均需人工核查；已拒绝的结果不会重新作为有效分类展示。</p>`;
}

function topicsPage(p) {
  return `<div class="notice-inline">${icon('spark')} 主题是反馈的整理建议。候选主题需人工确认；归档保留历史关联，但不再参与新分类。</div><div class="topic-cards">${p.topics.length ? p.topics.map((t,i)=>{const fs=p.feedback.filter(f=>f.topicId===t.id&&effective(f));return `<section class="panel topic-card"><div class="topic-card-top"><span class="topic-mark color-${i%4}">${icon('layers')}</span>${tag({candidate:'候选主题',confirmed:'已确认主题',archived:'已归档'}[t.status],t.status==='candidate'?'amber':t.status==='confirmed'?'green':'muted')}</div><h2>${esc(t.name)}</h2><p>${esc(t.description||'来自导入反馈的分类主题，请核查原文。')}</p><div class="topic-number">${fs.length}<small>条关联反馈</small></div><blockquote>${esc(fs[0]?.content||'当前没有有效分类的反馈')}</blockquote><div class="card-actions">${btn('topic-feedback','查看反馈','text',`data-id="${t.id}"`)}${btn('edit-topic','管理主题','text',`data-id="${t.id}"`)}${t.status==='candidate'?btn('confirm-topic','确认','secondary',`data-id="${t.id}"`):t.status==='confirmed'?btn('topic-requirement','创建需求','secondary',`data-id="${t.id}"`):''}</div></section>`;}).join(''):empty('还没有主题','导入反馈后可分析并确认主题。')}</div>`;
}

function requirementsPage(p) {
  const params=route().params;
  const items=p.requirements.filter(r=>(!params.get('status')||r.status===params.get('status'))&&(!params.get('priority')||r.priority===params.get('priority')));
  return `<div class="notice-inline">${icon('list')} 需求优先级由你判断；关联来源在创建时保存快照，后续主题变化不会自动增加反馈。</div><div class="filterbar"><select data-filter="status" aria-label="需求状态筛选"><option value="">全部状态</option>${['pending','planned','in_progress','done','rejected'].map(k=>`<option value="${k}" ${params.get('status')===k?'selected':''}>${reqLabels[k]}</option>`).join('')}</select><select data-filter="priority" aria-label="需求优先级筛选"><option value="">全部优先级</option>${['unset','low','medium','high'].map(k=>`<option value="${k}" ${params.get('priority')===k?'selected':''}>${reqLabels[k]}</option>`).join('')}</select>${btn('clear-requirement-filters','清除筛选','text')}</div><section class="panel table-panel">${items.length ? `<div class="table-scroll"><table><thead><tr><th>需求与来源</th><th>优先级</th><th>状态</th><th>创建日期</th><th></th></tr></thead><tbody>${items.map(r=>`<tr><td class="feedback-content"><button data-action="requirement-detail" data-id="${r.id}">${esc(r.title)}</button><small>${r.sources.length} 条来源反馈 <span>·</span> ${esc([...new Set(r.sources.map(s=>s.topicName))].join('、'))}</small></td><td>${tag(reqLabels[r.priority],r.priority==='high'?'amber':'')}</td><td>${tag(reqLabels[r.status],r.status==='done'?'green':'')}</td><td class="subtle">${esc(localDate(r.createdAt))}</td><td><button class="icon-btn" data-action="requirement-detail" data-id="${r.id}" aria-label="查看需求">${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>` : empty(p.requirements.length?'没有符合筛选的需求':'还没有需求','可以清除筛选，或选择反馈创建需求。',p.requirements.length?btn('clear-requirement-filters','清除筛选'):btn('nav-feedback','查看用户反馈'))}</section>`;
}

function openModal(title, body, wide=false) {
  if(modal.open&&formDirty&&!window.confirm('有未保存的修改，确认放弃并打开新窗口？'))throw new Error('已保留当前编辑内容。');
  formDirty = false;
  modal.className = wide ? 'wide-modal' : '';
  modal.innerHTML = `<div class="modal-header"><h2 id="modal-title">${title}</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="modal-content">${body}<p id="form-error" class="form-error" role="alert"></p></div>`;
  if (!modal.open) modal.showModal();
}
function formError(e) { const box=modal.open && $('#form-error',modal); if(box) box.textContent=e.message; else toast(e.message); }
function attempt(fn) { try { fn(); } catch(e) { formError(e); } }
function updateFilter(key,value) { const {name,params}=route();value ? params.set(key,value):params.delete(key);if(params.get('from')&&params.get('to')&&params.get('from')>params.get('to')){toast('起始日期不能晚于结束日期。');render();return;}selected.clear(); page=1; location.hash=`${name}?${params}`; render(); }

function openDetail(id) {
  const p=projectOf(state), f=p.feedback.find(f=>f.id===id); if(!f) return toast('反馈不存在。');

function openRequirement(ids) {
  const p=projectOf(state), fs=ids.map(id=>p.feedback.find(f=>f.id===id)).filter(Boolean);
  if(!fs.length) return toast('请先在反馈列表勾选来源反馈，或从主题创建需求。');
  if(fs.length>200 || fs.some(f=>!effective(f))) return toast('最多选择 200 条反馈，且必须有有效分类。');
  const revisionMap = fs.map(f=>[f.id,f.revision]);
  openModal('从反馈创建需求', `<p class="subtle">保留 ${fs.length} 条来源反馈的当前快照，后续新增反馈不会自动加入。</p><form id="requirement-form"><label>需求标题<input name="title" required maxlength="120" placeholder="例如：Agent 应用代码前支持差异预览"></label><label>需求描述<textarea name="description" rows="3" maxlength="5000" placeholder="记录问题、预期行为，以及需要进一步验证的假设"></textarea></label><label>优先级<select name="priority"><option value="unset">未设置</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label>${requirementFields(esc)}<div class="source-list">${fs.map(f=>`<div>${tag(topicOf(p,f)?.name||'未归类')} ${reviewTag(f)}<p>${esc(f.content)}</p></div>`).join('')}</div>${fs.some(f=>!isReviewed(f))?'<label class="checkbox-label"><input name="acknowledge" type="checkbox" required>来源包含未审核建议，我已查看来源，仍创建需求。</label>':''}<div class="form-actions"><button class="btn secondary" type="button" data-action="close">取消</button><button class="btn primary" type="submit">创建并关联来源</button></div></form>`, true);
  $('#requirement-form').addEventListener('submit',e=>{e.preventDefault();attempt(()=>{const data=Object.fromEntries(new FormData(e.target));commit(p=>{if(revisionMap.some(([id,rev])=>p.feedback.find(f=>f.id===id)?.revision!==rev))throw new Error('来源已变化，请关闭后重新选择。');const req=createRequirement(p,data,ids,Boolean(data.acknowledge));Object.assign(req,requirementExtras(data));});markGuide(projectOf(state).id,{requirementCreated:true});modal.close();go('requirements');toast('需求已创建，来源快照已保留。');});});
}

function rowKeys(row) {const v=row.values;return [JSON.stringify(['file',importData.fileHash,row.recordNo]),...(v?.external_id?[JSON.stringify(['source',v.source,v.external_id])]:[])];}
function resolveImportRows(p) {
  const keys=new Set(p.feedback.flatMap(f=>f.keys||[]));
  return importData.results.map(row=>{if(row.status!=='valid')return {...row,outcome:row.status};const rk=rowKeys(row);if(rk.some(k=>keys.has(k)))return {...row,outcome:'duplicate'};rk.forEach(k=>keys.add(k));return {...row,outcome:'new',keys:rk};});
}
function showPreview() {
  const rows=resolveImportRows(projectOf(state));importData.resolved=rows;
  const count=status=>rows.filter(r=>r.outcome===status).length;
  openModal('确认导入预览',`<div class="import-steps"><span>01 选择文件</span><b>02 映射与校验</b><span>03 导入结果</span></div><div class="import-counts">${[['new','可导入'],['invalid','错误行'],['empty','空行'],['duplicate','重复行']].map(([k,l])=>`<div><strong>${count(k)}</strong><span>${l}</span></div>`).join('')}</div><p class="subtle">已校验全文件，以下仅预览前 20 条；错误和重复行将跳过。</p><div class="preview-scroll"><table><thead><tr><th>原记录号</th><th>正文 / 错误说明</th><th>结果</th></tr></thead><tbody>${rows.slice(0,20).map(r=>`<tr><td>${r.recordNo}</td><td>${esc(r.errors.length?r.errors.join('；'):r.values?.content||'空行')}</td><td>${tag({new:'可导入',invalid:'错误',empty:'跳过',duplicate:'重复'}[r.outcome],r.outcome==='invalid'?'amber':'')}</td></tr>`).join('')}</tbody></table></div><div class="form-actions">${btn('import-errors','导出错误报告','text')}${btn('import-remap','返回映射','secondary')}${btn('confirm-import',`导入 ${count('new')} 条有效反馈`,'primary',count('new')?'':'disabled')}</div>`,true);
}
function confirmImport() {
  if(!importData || projectOf(state).id!==importData.projectId)throw new Error('项目已变化，请重新导入。');
  const rows=resolveImportRows(projectOf(state)), fresh=rows.filter(r=>r.outcome==='new');
  if(projectOf(state).feedback.length+fresh.length>10000)throw new Error('导入后将超过本机项目 10,000 条反馈上限，请减少本批数据或使用新项目。');

  render();

function simulate() {

  modal.close();go('feedback');toast('模拟分类完成，结果仍待人工审核。');
}

function about() {openModal('关于这份公开演示',`<div class="about-logo"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTIiIGZpbGw9IiNiOWVkOGIiLz48cGF0aCBkPSJNMTEgMTJoOHY3aDEwdjlIMTF6IiBmaWxsPSIjMjAzNTJiIi8+PHBhdGggZD0iTTI0IDEwaDV2NWgtNXoiIGZpbGw9IiMyMDM1MmIiLz48L3N2Zz4K" alt="" width="42" height="42"><strong>InsightFlow</strong>${tag('MVP 交互演示','green')}</div><p>为软件 App 产品经理与独立开发者设计，把零散用户反馈整理为可核查、可跟进的需求。</p><ol class="about-list"><li>示例项目与反馈均为合成数据；预设分类不是实际 AI 运行结果。</li><li>上传文件只在浏览器解析；“模拟分类”使用关键词规则，不调用 DeepSeek。</li><li>审核与需求变化保存在本机浏览器，不跨设备同步，清理站点数据会丢失。</li><li>静态演示不要求登录、不含密钥；云端或本地接口可显式启用真实 AI；发送前需确认，调用会消耗作者的额度。</li><li>云端接口只负责限额与真实 AI 分析；反馈仍存当前浏览器，尚无后台队列、多账号或跨设备同步。</li></ol><div class="form-actions">${btn('backup','导出浏览器数据','secondary')}${btn('close','开始探索','primary')}</div>`);}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
  const action=b.dataset.action,id=b.dataset.id;
  attempt(()=>{
    const p=projectOf(state);
    if(action==='close'){if(!formDirty || window.confirm('有未保存的修改，确认放弃并关闭？')){formDirty=false;modal.close();}}
    else if(action==='ai-settings')aiSettings();
    else if(action==='refresh-ai')refreshBackend().then(()=>{aiSettings();render();});
    else if(action==='real-ai')startRealAi();
    else if(action==='confirm-real-ai')runRealAi().catch(formError);
    else if(action==='stop-real-ai'){if(realAiRun){realAiRun.stop=true;toast('将完成当前请求后停止，当前请求可能已产生费用。');}}
    else if(action==='about')about();
    else if(action==='start-tour')tour.start();
    else if(action==='guide-show'){markGuide(p.id,{hidden:false});render();}
    else if(action==='guide-skip'){markGuide(p.id,{hidden:true});render();}
    else if(action==='guide-explore'){markGuide(p.id,{explored:true});go('overview');}
    else if(action==='guide-review'){
      const item=p.feedback.find(f=>effective(f)&&f.review==='pending'&&topicOf(p,f)?.status==='confirmed')||p.feedback.find(f=>effective(f)&&topicOf(p,f)?.status==='confirmed');
      if(!item){toast('请先录入或导入反馈，并完成一次分类；候选主题需先确认。');go('feedback');}
      else{go('feedback',{q:item.content});openDetail(item.id);}
    }
    else if(action==='guide-requirement'){const item=p.feedback.find(f=>f.id===guideState(p.id).reviewedId);if(!item||!isReviewed(item)||!effective(item))throw new Error('请先核查并保存一条反馈，再从它创建需求。');openRequirement([item.id]);}
    else if(action==='guide-sample-csv')openSampleImport();
    else if(action==='import')openImport();
    else if(action==='manual-feedback')products.manualFeedback();
    else if(action==='export-requirement')products.exportRequirement(id);
    else if(action==='export-feedback'){const rows=filtered();if(!rows.length)throw new Error('当前筛选没有反馈可导出。');const headers=['反馈原文','来源','平台','App 版本','反馈日期','主主题','情绪','问题类型','分析状态','审核状态','分析来源'];download('insightflow-feedback.csv','\uFEFF'+[headers,...rows.map(f=>[f.content,f.source,f.platform,f.appVersion,f.date,topicOf(p,f)?.name||'',labels[f.sentiment],labels[f.issueType],f.analysisStatus,labels[f.review],f.origin])].map(row=>row.map(escapeCsvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(`已导出当前筛选的 ${rows.length} 条反馈。`);}
    else if(action==='detail')openDetail(id);
    else if(action==='nav-topics')go('topics');
    else if(action==='nav-feedback')go('feedback');
    else if(action==='review-pending')go('feedback',{review:'pending'});
    else if(action==='scope-all'||action==='scope-reviewed'){const query=Object.fromEntries(route().params);delete query.scope;if(action==='scope-reviewed')query.scope='reviewed';go('overview',query);}
    else if(action==='topic-feedback')go('feedback',{...Object.fromEntries(route().params),topic:id});
    else if(action==='clear-filters')go(route().name==='overview'?'overview':'feedback');
    else if(action==='clear-requirement-filters')go('requirements');
    else if(action==='select-visible'){filtered().slice((page-1)*20,page*20).forEach(f=>selected.add(f.id));render();}
    else if(action==='prev-page'){page=Math.max(1,page-1);render();}
    else if(action==='next-page'){page++;render();}
    else if(action==='confirm-topic'){const topic=p.topics.find(t=>t.id===id);commit(p=>setTopicStatus(p,id,topic.revision||0,'confirmed'));render();toast('主题已确认，关联反馈仍需分别审核。');}
    else if(action==='edit-topic')panels.topicEditor(id);
    else if(action==='archive-topic'||action==='restore-topic')panels.topicStatus(id,Number(b.dataset.revision),action==='archive-topic'?'archived':'confirmed');
    else if(action==='edit-requirement')panels.requirementEditor(id);
    else if(action==='import-history')panels.history();
    else if(action==='import-history-detail')panels.historyDetail(id);
    else if(action==='analysis-history')panels.analysisHistory();
    else if(action==='analysis-history-detail')panels.analysisHistoryDetail(id);
    else if(action==='restore-backup')panels.restore();
    else if(action==='batch-confirm'){
      if(!selected.size||selected.size>200)throw new Error('请选择 1—200 条待审核反馈。');
      const ids=[...selected], feedback=ids.map(id=>p.feedback.find(f=>f.id===id));
      if(feedback.some(f=>!f||f.review!=='pending'||f.analysisStatus!=='succeeded'))throw new Error('选择中含非待审核或未分析反馈，请筛选“待审核”后重新选择。');
      if(new Set(feedback.map(f=>f.topicId)).size!==1)throw new Error('批量确认仅支持同一主题。请先按主题筛选，再选择待审核反馈。');
      const topic=p.topics.find(t=>t.id===feedback[0].topicId);
      if(!topic||topic.status!=='confirmed')throw new Error('请先在主题页确认候选主题；已归档主题不能批量审核。');
      const revisions=new Map(feedback.map(f=>[f.id,f.revision]));
      openModal('确认批量审核',`<p>将确认主题「${esc(topic.name)}」下的 ${ids.length} 条反馈。请核查每条原文；确认后记录人工审核结果。</p><div class="source-list">${feedback.map(f=>`<div><p>${esc(f.content)}</p>${tag(labels[f.sentiment])}</div>`).join('')}</div><div class="form-actions">${btn('close','取消','secondary')}<button id="confirm-batch-review" class="btn primary">确认这 ${ids.length} 条反馈</button></div>`,true);
      $('#confirm-batch-review').addEventListener('click',()=>attempt(()=>{
        commit(p=>{for(const id of ids){const f=p.feedback.find(f=>f.id===id);if(!f||f.review!=='pending'||f.topicId!==topic.id)throw new Error('反馈已变化，请重新选择并核查。');reviewFeedback(p,id,revisions.get(id),'confirmed');}});
        selected.clear();modal.close();render();toast('所选反馈已确认。');
      }));
    }
    else if(action==='reject-feedback'){commit(p=>reviewFeedback(p,id,Number(b.dataset.revision),'rejected'));modal.close();render();toast('已拒绝分类，原文保留。');}
    else if(action==='new-requirement'){go('feedback');toast('请勾选来源反馈，再点击“转为需求”。');}
    else if(action==='selected-requirement')openRequirement([...selected]);
    else if(action==='topic-requirement')openRequirement(p.feedback.filter(f=>f.topicId===id&&effective(f)).map(f=>f.id));
    else if(action==='requirement-detail')requirementDetail(id);
    else if(action==='import-remap')showMapping();
    else if(action==='confirm-import'){b.disabled=true;try{confirmImport();}catch(error){b.disabled=false;throw error;}}
    else if(action==='simulate')simulate();
    else if(action==='show-imported'){modal.close();go('feedback');}
    else if(action==='import-errors'){if(!importData?.results)throw new Error('没有可导出的错误。');const rows=importData.results.filter(r=>r.status==='invalid');download('insightflow-import-errors.csv','\uFEFF'+[['原记录号','错误原因','原始内容'],...rows.map(r=>[r.recordNo,r.errors.join('；'),r.values?.raw_text||''])].map(row=>row.map(escapeCsvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
    else if(action==='backup'){let raw;try{raw=localStorage.getItem(STORAGE_KEY);}catch{}download('insightflow-demo-backup.json',raw||JSON.stringify(state,null,2));toast('备份含本机反馈原文，请妥善保管。');}
    else if(action==='reset'){openModal('重置当前浏览器的演示？','<p>将清除所有演示项目、导入反馈和需求，恢复初始示例。可以先导出备份。</p><div class="form-actions">'+btn('backup','先导出备份','secondary')+btn('reset-confirm','确认重置','primary')+'</div>');}
    else if(action==='reset-confirm'){const next=initialState();saveState(localStorage,next);state=next;storageError='';storageCorrupt=false;selected.clear();modal.close();go('overview');toast('演示已重置。');}
    else if(action==='new-project'){
      openModal('创建 App 项目','<form id="project-form"><label>项目名称<input name="name" required maxlength="80" placeholder="例如：我的 App"></label><label>App 名称<input name="appName" required maxlength="120" placeholder="产品名称"></label><p class="footnote">新项目独立保存反馈、主题和需求，仍属于当前浏览器内的演示数据。</p><div class="form-actions"><button class="btn primary" type="submit">创建项目</button></div></form>');
      $('#project-form').addEventListener('submit',e=>{e.preventDefault();attempt(()=>{const data=Object.fromEntries(new FormData(e.target));if(!data.name.trim()||!data.appName.trim())throw new Error('名称不能全为空白。');commit((_p,s)=>{const id=uid();s.projects.push({id,name:data.name.trim(),appName:data.appName.trim(),feedback:[],topics:[],requirements:[],imports:[],isSample:false});s.activeProjectId=id;});modal.close();go('overview');});});
    }
  });
});

window.addEventListener('hashchange',()=>{selected.clear();page=1;render();});
modal.addEventListener('input',()=>{formDirty=true;});
modal.addEventListener('cancel',e=>{if(formDirty&&!window.confirm('有未保存的修改，确认放弃并关闭？'))e.preventDefault();});
modal.addEventListener('close',()=>{formDirty=false;if(realAiRun&&!realAiRun.confirmed)realAiRun=null;});
window.addEventListener('beforeunload',e=>{if((modal.open&&formDirty)||realAiRun?.confirmed){e.preventDefault();e.returnValue='';}});
window.addEventListener('pagehide',()=>{if(realAiRun?.confirmed){try{commit((_p,s)=>{const log=s.projects.find(p=>p.id===realAiRun.projectId)?.analysisRuns.find(r=>r.id===realAiRun.journalId);if(log){log.status='interrupted';for(const i of log.items){if(i.status==='running')i.status='unknown';else if(i.status==='queued')i.status='not_started';}}});}catch{}}});
setInterval(()=>{if(!realAiRun?.confirmed&&!storageCorrupt){const next=structuredClone(state);if(recoverInterruptedRuns(next)){try{saveState(localStorage,next);state=next;render();}catch(e){toast(e.message);}}}},30_000);
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){try{state=loadState(localStorage);selected.clear();if(modal.open&&formDirty){render();formError(new Error('另一标签页已更新数据。当前草稿保留；保存时若发生冲突，请复制草稿后重新打开。'));}else{modal.close();render();toast('检测到另一标签页的数据变化，已刷新。');}}catch(error){storageError=error.message;storageCorrupt=true;render();}}});
render();
refreshBackend().then(render);

return {};
})();
</script>
</body>
</html>
